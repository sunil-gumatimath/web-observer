<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" width="320" height="48" fill="none" role="img" aria-label="Web Observer">
  <title>Web Observer</title>
  <desc>Minimal target mark — web change detection and alerting</desc>
  <style>
    .t1 { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; fill: #0f172a; }
    .t2 { font-weight: 500; fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .t1 { fill: #f8fafc; }
      .t2 { fill: #cbd5e1; }
    }
  </style>
  <!-- Mark 36×36 at (6,6) — clean target + scanning arc -->
  <g transform="translate(6 6)">
    <rect x="0.5" y="0.5" width="35" height="35" rx="10.5" fill="#0f172a"/>
    <rect x="0.5" y="0.5" width="35" height="35" rx="10.5" stroke="white" stroke-opacity="0.08"/>
    <!-- outer hairline track -->
    <circle cx="18" cy="18" r="10.75" stroke="white" stroke-opacity="0.14" stroke-width="1.05"/>
    <!-- active scanning arc — sky accent -->
    <path d="M 18 7.25 A 10.75 10.75 0 0 1 27.45 11" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="27.45" cy="11" r="1.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1"/>
    <circle cx="27.45" cy="11" r="2.75" fill="#38bdf8" fill-opacity="0.18"/>
    <!-- middle ring -->
    <circle cx="18" cy="18" r="6.65" stroke="white" stroke-width="1.5" stroke-opacity="0.95"/>
    <!-- center dot — the page -->
    <circle cx="18" cy="18" r="2.65" fill="white"/>
  </g>
  <text x="54" y="30.5" class="t1">Web<tspan class="t2" dx="0.28em">Observer</tspan></text>
</svg>
