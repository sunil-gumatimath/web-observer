# Web Observer full stack (local Docker deployment).
#
# Postgres stays external (Neon) — DATABASE_URL is read from backend/.env.
# Redis now runs in this compose project, so the flaky WSL/localhost
# forwarding is no longer involved: services reach it at redis://redis:6379/0
# while Windows clients keep using redis://localhost:6379/0.
#
# Start:   docker compose up -d --build
# Stop:    docker compose down
# Logs:    docker compose logs -f api
#
# Migrations (opt-in): the API only auto-creates tables when APP_ENV is a
# development value. For production-style deploys run Alembic explicitly:
#   docker compose --profile tools run --rm migrate
# Don't run it against a DB built by create_all and never stamped; stamp first
# (alembic stamp head) or Alembic will try to re-create existing tables.
x-backend-common: &backend-common
  build: ./backend
  restart: unless-stopped
  env_file: backend/.env
  environment:
    # In-container Redis coordinate (overrides backend/.env value)
    REDIS_URL: redis://redis:6379/0
    # Snapshots persist on the host's ./data/snapshots (MinIO/S3 is not part
    # of this stack, so force local storage regardless of backend/.env)
    STORAGE_BACKEND: local
    LOCAL_STORAGE_PATH: /data/snapshots
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./data/snapshots:/data/snapshots
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend-common
    ports:
      - "8002:8002"
    # uvicorn CMD lives in the backend image

  worker-http:
    <<: *backend-common
    command:
      [
        "dramatiq",
        "app.workers",
        "--queues",
        "http_checks",
        "notifications",
        "--processes",
        "1",
        "--threads",
        "2",
      ]

  worker-browser:
    <<: *backend-common
    command:
      [
        "dramatiq",
        "app.workers",
        "--queues",
        "browser_checks",
        "--processes",
        "1",
        "--threads",
        "1",
      ]

  scheduler:
    <<: *backend-common
    command: ["python", "-m", "app.scheduler"]

  # Enqueues scheduled workspace digests (polls every DIGEST_POLL_SECONDS).
  digest:
    <<: *backend-common
    command: ["python", "-m", "app.digest_job", "--loop"]

  # Purges expired snapshots/runs once a day (retention_job is a one-shot CLI).
  retention:
    <<: *backend-common
    command:
      [
        "sh",
        "-c",
        "while true; do python -m app.retention_job; sleep 86400; done",
      ]

  # One-shot Alembic upgrade; only runs when invoked via the `tools` profile.
  migrate:
    <<: *backend-common
    profiles: ["tools"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
