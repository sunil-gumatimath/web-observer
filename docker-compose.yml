services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: web_observer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d web_observer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NOTE: no MinIO service. Snapshots default to local disk
  # (STORAGE_BACKEND=local), so an S3-compatible container is dead weight for
  # the documented setup. To exercise the S3 backend, run MinIO separately and
  # set STORAGE_BACKEND=s3 / S3_ENDPOINT_URL in .env.

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    healthcheck:
      # The first character is bracketed on purpose. `pgrep -f` matches full
      # command lines, including the /bin/sh -c that runs this healthcheck, so
      # a plain 'app.scheduler' pattern always matches its own shell and reports
      # healthy even when the scheduler process is gone. '[a]pp.scheduler' is
      # the same regex but cannot match the literal pattern text.
      test: ["CMD-SHELL", "pgrep -f '[a]pp.scheduler' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # HTTP + notification queues only (browser has its own service)
    command: dramatiq app.workers --queues http_checks notifications --processes 1 --threads 4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    healthcheck:
      # Bracketed pattern: see the scheduler note above.
      test: ["CMD-SHELL", "pgrep -f '[d]ramatiq' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  digest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.digest_job --loop
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    healthcheck:
      # Bracketed pattern: see the scheduler note above.
      test: ["CMD-SHELL", "pgrep -f '[d]igest_job' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy

  worker-browser:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser
    command: dramatiq app.workers --queues browser_checks --processes 1 --threads 1
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
      MAX_BROWSER_CHECKS_PER_DAY: "50"
    volumes:
      - ./backend:/app
    healthcheck:
      # Bracketed pattern: see the scheduler note above.
      test: ["CMD-SHELL", "pgrep -f '[d]ramatiq' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Heavy process — limit memory if host supports it
    mem_limit: 2g

  web:
    image: node:22.23.1-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8002
      NEXT_PUBLIC_INTERNAL_API_TOKEN: dev-internal-token
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
