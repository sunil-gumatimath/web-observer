services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: web_observer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d web_observer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/monitor-snapshots || true;
      exit 0;
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app.scheduler' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # HTTP + notification queues only (browser has its own service)
    command: dramatiq app.workers --queues http_checks notifications --processes 1 --threads 4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dramatiq > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  digest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.digest_job --loop
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'digest_job' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy

  worker-browser:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser
    command: dramatiq app.workers --queues browser_checks --processes 1 --threads 1
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/web_observer
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      MAX_BROWSER_CHECKS_PER_DAY: "50"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dramatiq > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Heavy process — limit memory if host supports it
    mem_limit: 2g

  web:
    image: node:22.23.1-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8002
      NEXT_PUBLIC_INTERNAL_API_TOKEN: dev-internal-token
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
