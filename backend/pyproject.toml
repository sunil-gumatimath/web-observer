[project]
name = "web-observer"
version = "0.1.0"
description = "Web change-detection and alerting platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
# Type-check against the project virtualenv so typed/compiled deps like
# selectolax resolve; keep `app.*` importable with backend/ as the root.
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
