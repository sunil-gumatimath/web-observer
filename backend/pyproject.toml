[project]
name = "web-observer"
version = "0.1.0"
description = "Web change-detection and alerting platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
[tool.ruff.lint.per-file-ignores]
# Frozen migration history: style-only rewrites would churn every revision
# file for no runtime benefit. Real regressions still surface via tests.
"alembic/versions/*" = ["I001", "UP007", "UP035", "F401"]
[tool.pyright]
# Type-check against the project virtualenv so typed/compiled deps like
# selectolax resolve; keep `app.*` importable with backend/ as the root.
# NOTE: `.venv` must be a *Windows* venv on this machine. A venv created from
# WSL (POSIX `bin/` layout) leaves pyright unable to resolve any third-party
# import, which surfaces as repo-wide "could not be resolved" false positives.
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
