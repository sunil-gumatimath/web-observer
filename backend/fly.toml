app = "web-observer-api"
primary_region = "bom" # Mumbai — close to Neon ap-south-1. Swap to iad/sin if needed

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8000"
  STORAGE_BACKEND = "local"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off" # free tier: keep api warm; set to "stop" to save hours
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  processes = ["api"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  processes = ["worker"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
  processes = ["browser"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
  processes = ["scheduler"]

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
  worker = "dramatiq app.workers --queues http_checks notifications --processes 1 --threads 2"
  browser = "dramatiq app.workers --queues browser_checks --processes 1 --threads 1"
  scheduler = "python -m app.scheduler"

# Mount 1GB volume for local snapshots (brand-assets / screenshots)
# Create first: fly volumes create data --region bom --size 1 -a web-observer-api
# [[mounts]]
#   source = "data"
#   destination = "/data"
#   processes = ["api", "worker", "browser"]

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "15s"
    timeout = "5s"
    path = "/health"
  [checks.ready]
    port = 8000
    type = "http"
    interval = "15s"
    timeout = "5s"
    path = "/ready"
