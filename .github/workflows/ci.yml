name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # APP_ENV must be explicit: Settings.is_development() is opt-in, so an
      # unset APP_ENV is treated as production and the startup guards will
      # refuse to build settings without pinned SECRET_KEY/INTERNAL_API_TOKEN.
      APP_ENV: development
      TEST_DATABASE_URL: postgresql+psycopg://monitor:monitor@localhost:5432/web_observer_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: web_observer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor -d web_observer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Ruff check
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Validate compose
        run: docker compose -f ../docker-compose.yml config --quiet
      - name: Unit tests
        run: pytest -q -m "not integration"

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      TEST_DATABASE_URL: postgresql+psycopg://monitor:monitor@localhost:5432/web_observer_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: web_observer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor -d web_observer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # These are the tests that exercise real Postgres behaviour: baseline
      # detection, outbox idempotency, retention, and quota enforcement. They
      # were previously deselected everywhere, so regressions in change
      # detection could ship without any signal.
      - name: Integration tests
        run: pytest -q -m "integration"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + ESLint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8002
          NEXT_PUBLIC_INTERNAL_API_TOKEN: dev-internal-token
          NEXT_PUBLIC_DEV_WORKSPACE_ID: ""
