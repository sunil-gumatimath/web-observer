name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # APP_ENV must be explicit: Settings.is_development() is opt-in, so an
      # unset APP_ENV is treated as production and the startup guards will
      # refuse to build settings without pinned SECRET_KEY/INTERNAL_API_TOKEN.
      APP_ENV: development
      TEST_DATABASE_URL: postgresql+psycopg://monitor:monitor@localhost:5432/web_observer_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: web_observer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor -d web_observer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # gitleaks-action scans the pushed commit range on push events; a
        # shallow (depth=1) clone cannot resolve that range and the scan
        # fails with "unknown revision". Fetch the full history instead.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Ruff check
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
      - name: Unit tests
        run: pytest -q -m "not integration"

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      TEST_DATABASE_URL: postgresql+psycopg://monitor:monitor@localhost:5432/web_observer_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: web_observer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor -d web_observer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Alembic migrations on integration DB
        run: |
          alembic upgrade head
          alembic current
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      # These are the tests that exercise real Postgres behaviour: baseline
      # detection, outbox idempotency, retention, and quota enforcement. They
      # were previously deselected everywhere, so regressions in change
      # detection could ship without any signal.
      - name: Integration tests
        run: pytest -q -m "integration"

  migrations:
    name: Alembic populated upgrade & downgrade round-trip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      TEST_DATABASE_URL: postgresql+psycopg://monitor:monitor@localhost:5432/web_observer_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: web_observer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor -d web_observer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run populated upgrade & downgrade migration tests
        run: pytest -q tests/test_issue_fixes_65_69.py -m "integration"
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # gitleaks-action scans the pushed commit range on push events; a
        # shallow (depth=1) clone cannot resolve that range and the scan
        # fails with "unknown revision". Fetch the full history instead.
        with:
          fetch-depth: 0
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8002
          NEXT_PUBLIC_INTERNAL_API_TOKEN: dev-internal-token
          NEXT_PUBLIC_DEV_WORKSPACE_ID: ""

  workers:
    name: Cloudflare worker tests and config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/browser-failover/package-lock.json
      - name: Install browser worker dependencies
        working-directory: workers/browser-failover
        run: npm ci
      - name: Test browser failover worker
        working-directory: workers/browser-failover
        run: npm test
      - name: Test share cache worker
        working-directory: workers/share-cache
        run: npm test
      - name: Validate browser worker config
        working-directory: workers/browser-failover
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/browser-failover"
      - name: Validate share cache worker config
        working-directory: workers/share-cache
        run: ../browser-failover/node_modules/.bin/wrangler deploy --dry-run --config wrangler.toml --outdir "$RUNNER_TEMP/share-cache"

  container:
    name: Docker image and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate Compose configuration
        run: |
          touch backend/.env frontend/.env.local
          docker compose config --quiet
      - name: Build application image
        run: >-
          docker buildx build --load --tag web-observer:ci
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8002
          .
