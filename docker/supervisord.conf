; Supervisor config for the all-in-one Web Observer container.
; Start order is controlled by `priority` (lower starts first).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir /data --appendonly yes --save 60 1
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8002
directory=/app/backend
priority=20
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-http]
command=/usr/local/bin/wait-for-redis.sh dramatiq app.workers --queues http_checks notifications --processes 1 --threads 2
directory=/app/backend
priority=30
environment=dramatiq_prom_port=9191,dramatiq_prom_db=/tmp/prom-http
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-ai]
command=/usr/local/bin/wait-for-redis.sh dramatiq app.workers --queues ai_enrichment --processes 1 --threads 1
directory=/app/backend
priority=30
environment=dramatiq_prom_port=9193,dramatiq_prom_db=/tmp/prom-ai
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-browser]
command=/usr/local/bin/wait-for-redis.sh dramatiq app.workers --queues browser_checks --processes 1 --threads 1
directory=/app/backend
priority=30
environment=dramatiq_prom_port=9192,dramatiq_prom_db=/tmp/prom-browser
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/wait-for-redis.sh python -m app.scheduler
directory=/app/backend
priority=30
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:digest]
command=/usr/local/bin/wait-for-redis.sh python -m app.digest_job --loop
directory=/app/backend
priority=30
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:retention]
command=/usr/local/bin/wait-for-redis.sh python -m app.retention_job --loop
directory=/app/backend
priority=30
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=node node_modules/next/dist/bin/next start --port 3000 --hostname 0.0.0.0
directory=/app/frontend
priority=40
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
