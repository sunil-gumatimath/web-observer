name = "share-cache"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Deployed to workers.dev for now (https://share-cache.clevertedz.workers.dev).
# When the project has a public hostname again, uncomment the routes below and
# set CACHE_HOST (a secret/plain-text binding) to that hostname:
#   routes = ["app.example.com/share/*", "app.example.com/_next/static/*"]

[vars]
# Must be set to the public app hostname when routed — empty CACHE_HOST
# disables caching entirely (fail closed, find #3 in the review).
CACHE_HOST = ""
