name = "share-cache"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Deployed to workers.dev for now (https://share-cache.clevertedz.workers.dev).
# When the project has a public hostname again, uncomment the routes below and
# set CACHE_HOST (a secret/plain-text binding) to that hostname:
#   routes = ["app.example.com/share/*", "app.example.com/_next/static/*"]

routes = [
  { pattern = "app.sunilted.qzz.io/share/*", zone_id = "103bb95edfbca4f2d449af67c0a0b492" },
  { pattern = "app.sunilted.qzz.io/_next/static/*", zone_id = "103bb95edfbca4f2d449af67c0a0b492" },
]

[vars]
# Active for the app's public hostname; requests for other hosts pass through.
CACHE_HOST = "app.sunilted.qzz.io"
