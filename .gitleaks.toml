# Gitleaks configuration — extends the default rule set.
#
# NOTE: local env files (.env, backend/.env) are deliberately NOT allowlisted
# here. They are git-ignored (.gitignore) runtime secret stores and a staged
# .env MUST fail the scan. Do not re-add path exceptions for them.
[extend]
useDefault = true

[allowlist]
description = "Git-ignored runtime artifacts only (never env files)"
paths = [
  # App-local runtime artifacts (all git-ignored): fetched page snapshots
  # contain THIRD-PARTY content, not project credentials.
  "^backend/data/",
  "^data/",
  "^logs/",
]
