<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="380" height="72" fill="none" role="img" aria-label="Web Monitor">
  <title>Web Monitor</title>
  <!-- Icon Mark -->
  <g transform="translate(6, 6)">
    <rect x="2" y="2" width="56" height="56" rx="15" fill="#0f1011" stroke="#23252a" stroke-width="1.5" class="icon-bg"/>
    <rect x="2.5" y="2.5" width="55" height="55" rx="14.5" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M18 19 L29 30 L18 41" stroke="#828fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 40 H44" stroke="#34d399" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- Breadcrumb Wordmark -->
  <text x="76" y="38" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.03em" class="word-primary">web</text>
  <text x="127" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21" font-weight="400" class="word-slash">/</text>
  <text x="142" y="38" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="25" font-weight="400" letter-spacing="-0.03em" class="word-secondary">monitor</text>
  <!-- Tagline -->
  <text x="76" y="55" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.04em" class="tag">KNOW WHEN PAGES CHANGE · DIFF ALERTS</text>
  <style>
    .icon-bg { fill: #0f1011; stroke: #23252a; }
    .word-primary { fill: #0f172a; }
    .word-slash { fill: #94a3b8; }
    .word-secondary { fill: #475569; }
    .tag { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .icon-bg { fill: #0f1011; stroke: #23252a; }
      .word-primary { fill: #f8fafc; }
      .word-slash { fill: #62666d; }
      .word-secondary { fill: #8a8f98; }
      .tag { fill: #62666d; }
    }
  </style>
</svg>